<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ILLUSTRATION｜多治川晴人</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .illustration-box {
      width: min(900px, 92%);
      margin: 70px auto 0;
      padding: 55px 35px 60px;

      background: #3f3f3f;

      box-sizing: border-box;
    }

    .illustration-box h2 {
      margin: 0 0 18px;

      color: #eee;

      font-size: 32px;
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .illustration-line {
      border: 0;
      border-top: 6px solid #383838;

      margin: 0 0 50px;
    }

    .illustration-item {
      text-align: center;
    }

    .illustration-item a {
      display: inline-block;
    }

    .illustration-item img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 80vh;

      margin: 0 auto;

      transition: opacity 0.2s;
    }

    .illustration-item img:hover {
      opacity: 0.85;
    }

    .illustration-caption {
      margin-top: 18px;

      color: #bbb;

      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .illustration-note {
      margin: 0 0 35px;

      color: #aaa;

      font-size: 11px;
      text-align: left;
    }

    @media (max-width: 700px) {

      .illustration-box {
        width: 100%;

        margin-top: 45px;

        padding:
          35px
          16px
          45px;
      }

      .illustration-box h2 {
        font-size: 25px;
      }

    }

  </style>

</head>


<body>

  <main>

    <img
      src="cheese-logo.png"
      alt="多治川晴人ロゴ"
      class="logo"
    >

    <h1>
      ILLUSTRATION
    </h1>


    <nav class="menu">

      <a href="index.html">
        HOME
      </a>

      <a href="news.html">
        NEWS
      </a>

      <a href="illustration.html">
        ILLUSTRATION
      </a>

      <a href="profile.html">
        PROFILE
      </a>

    </nav>


    <section class="illustration-box">

      <h2>
        落書き置き場
      </h2>

      <hr class="illustration-line">

      <p class="illustration-note">
        クリックで拡大
      </p>


      <div class="illustration-item">

        <a
          href="illustration_001.png"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="illustration_001.png"
            alt="多治川晴人 イラスト"
          >

        </a>

      </div>

    </section>

  </main>

</body>

</html>
