<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>熊よ｜多治川晴人</title>

  <!-- サイト共通デザイン -->
  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- 熊よ専用デザイン -->
  <style>

    /* =========================
       漫画ビューアのグレー箱
    ========================= */

    .manga-viewer {
      margin: 70px auto 0;

      width: min(1000px, 92%);

      padding:
        55px
        35px
        45px;

      background: #3f3f3f;

      box-sizing: border-box;

      text-align: center;

      user-select: none;
    }


    /* =========================
       グレー箱上部
    ========================= */

    .reader-heading {
      margin-bottom: 40px;

      color: #bbb;

      font-size: 12px;
      line-height: 1.8;

      text-align: left;
    }


    .reader-heading h2 {
      margin:
        0
        0
        50px;

      color: #ddd;

      font-size: 20px;
      font-weight: normal;

      text-align: center;
    }


    .reader-heading p {
      margin: 0;
    }


    /* =========================
       漫画表示領域
    ========================= */

    .manga-stage {
      position: relative;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 2px;

      width: 100%;

      margin: 0 auto;

      overflow: hidden;
    }


    /* 漫画1ページ */

    .manga-page {
      display: block;

      width: auto;
      height: auto;

      max-width: calc(50% - 1px);
      max-height: 78vh;

      object-fit: contain;
    }


    /* 3Pやスマホ縦の単ページ */

  .manga-page.single-page {
  max-width: calc(50% - 1px);
}
    /* 非表示ページ */

    .hidden-page {
      display: none;
    }


    /* =========================
       クリック領域
    ========================= */

    .page-zone {
      position: absolute;

      top: 0;
      bottom: 0;

      width: 50%;

      padding: 0;
      border: 0;

      background: transparent;

      cursor: pointer;

      z-index: 10;
    }


    /* 左半分 → 次ページ */

    .next-zone {
      left: 0;
    }


    /* 右半分 → 前ページ */

    .prev-zone {
      right: 0;
    }


    /* =========================
       ページ番号
    ========================= */

    #page-count {
      margin:
        18px
        0
        0;

      color: #aaa;

      font-size: 12px;

      letter-spacing: 0.08em;
    }


    .reader-help {
      margin:
        8px
        0
        0;

      color: #888;

      font-size: 11px;

      letter-spacing: 0.04em;
    }
.x-share {
  display: inline-block;

  margin-top: 28px;
  padding: 10px 24px;

  border: 1px solid #888;

  color: #bbb;
  background: transparent;

  font-size: 12px;
  letter-spacing: 0.12em;

  text-decoration: none;

  transition: 0.2s;
}

.x-share:hover {
  color: #fff;
  border-color: #fff;
}

    /* =========================
       スマホ縦だけ単ページ
    ========================= */

    @media
      (max-width: 700px)
      and (orientation: portrait) {

      .manga-viewer {
        width: 100%;

        margin-top: 45px;

        padding:
          35px
          10px
          30px;
      }


      .reader-heading {
        padding:
          0
          10px;
      }


      .reader-heading h2 {
        margin-bottom: 35px;
      }


      .manga-stage {
        display: block;
      }


      .manga-page {
        width: 100%;

        height: auto;

        max-width: 100%;
        max-height: none;

        margin: 0 auto;
      }

    }

  </style>

</head>


<body>

  <main>


    <!-- =====================
         上部ロゴ
    ====================== -->

    <img
      src="cheese-logo.png"
      alt="多治川晴人ロゴ"
      class="logo"
    >


    <!-- =====================
         タイトル
    ====================== -->

    <h1>
      熊よ
    </h1>


    <!-- =====================
         メニュー
    ====================== -->

    <nav class="menu">

      <a href="index.html">
        HOME
      </a>

      <a href="news.html">
        NEWS
      </a>

      <a href="illustration.html">
        ILLUSTRATION
      </a>

      <a href="profile.html">
        PROFILE
      </a>

      <a href="contact.html">CONTACT</a>
    </nav>


    <!-- =====================
         漫画ビューア
    ====================== -->

    <section class="manga-viewer">


      <!-- 説明 -->

      <div class="reader-heading">

        <h2>
          熊よ
        </h2>

        <p>
          ２０２３年冬制作
        </p>

        <p>
          左をクリックして読んでください
        </p>

      </div>


      <!-- 漫画本体 -->

      <div class="manga-stage">


        <!--
          左ページ
          見開き時は奇数ページ
          5、7、9……
        -->

        <img
          id="left-page"
          class="manga-page hidden-page"
          alt=""
        >


        <!--
          右ページ
          見開き時は偶数ページ
          4、6、8……

          最初だけ3Pを単独表示
        -->

        <img
          id="right-page"
          class="manga-page single-page"
          src="熊よ同人用B54_003.jpg"
          alt="熊よ 3ページ"
        >


        <!-- 左半分クリック＝次 -->

        <button
          type="button"
          class="page-zone next-zone"
          aria-label="次のページ"
        ></button>


        <!-- 右半分クリック＝戻る -->

        <button
          type="button"
          class="page-zone prev-zone"
          aria-label="前のページ"
        ></button>

      </div>


      <!-- ページ番号 -->

      <p id="page-count">
        3 / 49
      </p>


      <p class="reader-help">
        左クリック：次へ　右側クリック：戻る
      </p>
<a
  class="x-share"
  href="https://x.com/intent/tweet?text=漫画『熊よ』｜多治川晴人&url=https%3A%2F%2Ftajikawaharuto.github.io%2Fkumayo.html"
  target="_blank"
  rel="noopener noreferrer"
>
  Xで共有
</a>

    </section>

  </main>



  <script>

    /* =========================
       ページ設定
    ========================= */

    const FIRST_PAGE = 3;
    const LAST_PAGE = 49;


    /*
      現在位置。

      PC見開きなら
      4・5の組 → 4
      6・7の組 → 6
      として扱う。
    */

    let currentPage = FIRST_PAGE;



    /* =========================
       HTML要素取得
    ========================= */

    const leftPage =
      document.getElementById(
        "left-page"
      );


    const rightPage =
      document.getElementById(
        "right-page"
      );


    const pageCount =
      document.getElementById(
        "page-count"
      );


    const nextZone =
      document.querySelector(
        ".next-zone"
      );


    const prevZone =
      document.querySelector(
        ".prev-zone"
      );



    /* =========================
       画像ファイル名を作る
    ========================= */

    function filename(pageNumber) {

      const number =
        String(pageNumber)
          .padStart(3, "0");


      return (
        `熊よ同人用B54_${number}.jpg`
      );

    }



    /* =========================
       スマホ縦か判定
    ========================= */

    function isPhonePortrait() {

      return window
        .matchMedia(
          "(max-width: 700px) and (orientation: portrait)"
        )
        .matches;

    }



    /* =========================
       左ページを消す
    ========================= */

    function hideLeftPage() {

      leftPage
        .classList
        .add("hidden-page");


      leftPage
        .classList
        .remove("single-page");


      leftPage
        .removeAttribute("src");

    }



    /* =========================
       単ページ表示
    ========================= */

    function showSinglePage(pageNumber) {

      hideLeftPage();


      rightPage
        .classList
        .add("single-page");


      rightPage.src =
        filename(pageNumber);


      rightPage.alt =
        `熊よ ${pageNumber}ページ`;


      pageCount.textContent =
        `${pageNumber} / ${LAST_PAGE}`;


      preload(pageNumber + 1);

      preload(pageNumber - 1);

    }



    /* =========================
       見開き表示
    ========================= */

    function showSpread(pageNumber) {


      /*
        日本漫画なので

        左  | 右

        5   | 4
        7   | 6
        9   | 8

        奇数＝左
        偶数＝右
      */


      let rightNumber;


      if (
        pageNumber % 2 === 0
      ) {

        rightNumber =
          pageNumber;

      } else {

        rightNumber =
          pageNumber - 1;

      }


      const leftNumber =
        rightNumber + 1;



      /* ---------------------
         左の奇数ページ
      --------------------- */

      if (
        leftNumber <= LAST_PAGE
      ) {

        leftPage
          .classList
          .remove(
            "hidden-page",
            "single-page"
          );


        leftPage.src =
          filename(leftNumber);


        leftPage.alt =
          `熊よ ${leftNumber}ページ`;

      } else {

        hideLeftPage();

      }



      /* ---------------------
         右の偶数ページ
      --------------------- */

      rightPage
        .classList
        .remove("single-page");


      rightPage.src =
        filename(rightNumber);


      rightPage.alt =
        `熊よ ${rightNumber}ページ`;



      /* ---------------------
         ページ番号
      --------------------- */

      if (
        leftNumber <= LAST_PAGE
      ) {

        pageCount.textContent =
          `${rightNumber} - ${leftNumber} / ${LAST_PAGE}`;

      } else {

        pageCount.textContent =
          `${rightNumber} / ${LAST_PAGE}`;

      }



      /* ---------------------
         周辺画像を先読み
      --------------------- */

      preload(
        rightNumber + 2
      );

      preload(
        rightNumber + 3
      );

      preload(
        rightNumber - 1
      );

      preload(
        rightNumber - 2
      );

    }



    /* =========================
       現在位置を表示
    ========================= */

    function render() {


      /*
        3ページ目は
        どの端末でも単ページ。


        スマホ縦も
        全ページ単ページ。
      */


      if (
        currentPage === FIRST_PAGE ||
        isPhonePortrait()
      ) {

        showSinglePage(
          currentPage
        );

      } else {

        showSpread(
          currentPage
        );

      }

    }



    /* =========================
       次へ
    ========================= */

    function nextPage() {


      /*
        スマホ縦
        ↓
        1ページずつ進む
      */

      if (
        isPhonePortrait()
      ) {


        if (
          currentPage < LAST_PAGE
        ) {

          currentPage++;

          render();

        }


        return;

      }



      /*
        PC / iPad / スマホ横

        3
        ↓
        5 | 4
        ↓
        7 | 6
        ↓
        9 | 8
      */


      if (
        currentPage === FIRST_PAGE
      ) {

        currentPage = 4;

        render();

        return;

      }


      const rightNumber =
        currentPage % 2 === 0
          ? currentPage
          : currentPage - 1;


      /*
        48・49を表示中なら
        もう先へ行かない
      */

      if (
        rightNumber + 1 >=
        LAST_PAGE
      ) {

        return;

      }


      currentPage =
        rightNumber + 2;


      render();

    }



    /* =========================
       戻る
    ========================= */

    function prevPage() {


      /*
        スマホ縦
        ↓
        1ページずつ戻る
      */

      if (
        isPhonePortrait()
      ) {


        if (
          currentPage > FIRST_PAGE
        ) {

          currentPage--;

          render();

        }


        return;

      }



      /*
        3Pなら
        もう戻らない
      */

      if (
        currentPage <= FIRST_PAGE
      ) {

        return;

      }



      const rightNumber =
        currentPage % 2 === 0
          ? currentPage
          : currentPage - 1;



      /*
        5 | 4
        ↓
        3
      */

      if (
        rightNumber <= 4
      ) {

        currentPage =
          FIRST_PAGE;

      }


      /*
        それ以外は
        2ページ戻る
      */

      else {

        currentPage =
          rightNumber - 2;

      }


      render();

    }



    /* =========================
       画像先読み
    ========================= */

    function preload(pageNumber) {


      if (
        pageNumber < FIRST_PAGE ||
        pageNumber > LAST_PAGE
      ) {

        return;

      }


      const image =
        new Image();


      image.src =
        filename(
          pageNumber
        );

    }



    /* =========================
       マウス / タップ
    ========================= */

    nextZone
      .addEventListener(
        "click",
        nextPage
      );


    prevZone
      .addEventListener(
        "click",
        prevPage
      );



    /* =========================
       キーボード
    ========================= */

    document
      .addEventListener(
        "keydown",
        event => {


          /*
            日本漫画方向

            ← で次
            → で戻る
          */


          if (
            event.key ===
            "ArrowLeft"
          ) {

            nextPage();

          }


          if (
            event.key ===
            "ArrowRight"
          ) {

            prevPage();

          }

        }
      );



    /* =========================
       スマホ回転
    ========================= */

    window
      .addEventListener(
        "resize",
        render
      );



    /* =========================
       最初に3Pを表示
    ========================= */

    render();

  </script>

</body>

</html>
