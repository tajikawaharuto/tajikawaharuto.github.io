        >


        <!--

          最初は1Pを単独表示
        -->

          id="right-page"
          class="manga-page single-page"

        >

  <script>


    /* =========================
       ページ設定
    ========================= */


    const FIRST_PAGE = 1;

    const LAST_PAGE = 7;


    let currentPage =
      FIRST_PAGE;



    /* =========================
       実ファイル名
    ========================= */


    const pageFiles = [

      "mataattara_001 (2).jpg",

      "mataattara_003.jpg",

      "mataattara_004.jpg",

      "mataattara_005.jpg",

      "mataattara_006.jpg",

      "mataattara_007.jpg",

      "mataattara_008 (2).jpg"

    ];



    /* =========================
       HTML要素
    ========================= */


    const leftPage =
      document.getElementById(
        "left-page"
      );


    const rightPage =
      document.getElementById(
        "right-page"
      );


    const pageCount =
      document.getElementById(
        "page-count"
      );


    const nextZone =
      document.querySelector(
        ".next-zone"
      );


    const prevZone =
      document.querySelector(
        ".prev-zone"
      );



    /* =========================
       ページ番号から
       実ファイル名を取得
    ========================= */


    function filename(
      pageNumber
    ) {


      return pageFiles[
        pageNumber - 1
      ];

    }



    /* =========================
       スマホ縦判定
    ========================= */


    function isPhonePortrait() {

      return window
        .matchMedia(
          "(max-width: 700px) and (orientation: portrait)"
        )
        .matches;

    }



    /* =========================
       左ページを隠す
    ========================= */


    function hideLeftPage() {


      leftPage
        .classList
        .add(
          "hidden-page"
        );


      leftPage
        .removeAttribute(
          "src"
        );

    }



    /* =========================
       単ページ表示
    ========================= */


    function showSinglePage(
      pageNumber
    ) {


      hideLeftPage();


      rightPage
        .classList
        .add(
          "single-page"
        );


      rightPage.src =
        filename(
          pageNumber
        );


      rightPage.alt =
        `また会ったら ${pageNumber}ページ`;


      pageCount.textContent =
        `${pageNumber} / ${LAST_PAGE}`;


      preload(
        pageNumber + 1
      );


      preload(
        pageNumber - 1
      );

    }



    /* =========================
       見開き表示
    ========================= */


    function showSpread(
      pageNumber
    ) {


      /*
        日本漫画なので

        左 | 右

        3  | 2
        5  | 4
        7  | 6
      */


      const rightNumber =
        pageNumber % 2 === 0
          ? pageNumber
          : pageNumber - 1;


      const leftNumber =
        rightNumber + 1;



      /* 左ページ */


      if (
        leftNumber <= LAST_PAGE
      ) {


        leftPage
          .classList
          .remove(
            "hidden-page"
          );


        leftPage.src =
          filename(
            leftNumber
          );


        leftPage.alt =
          `また会ったら ${leftNumber}ページ`;


      } else {


        hideLeftPage();

      }



      /* 右ページ */


      rightPage
        .classList
        .remove(
          "single-page"
        );


      rightPage.src =
        filename(
          rightNumber
        );


      rightPage.alt =
        `また会ったら ${rightNumber}ページ`;



      /* ページ番号 */


      if (
        leftNumber <= LAST_PAGE
      ) {


        pageCount.textContent =
          `${rightNumber} - ${leftNumber} / ${LAST_PAGE}`;


      } else {


        pageCount.textContent =
          `${rightNumber} / ${LAST_PAGE}`;

      }



      /* 周辺画像を先読み */


      preload(
        rightNumber + 2
      );


      preload(
        rightNumber + 3
      );


      preload(
        rightNumber - 1
      );


      preload(
        rightNumber - 2
      );

    }



    /* =========================
       現在位置を表示
    ========================= */


    function render() {


      /*
        最初の1Pは単独。

        スマホ縦は
        全ページ単独。
      */


      if (
        currentPage === FIRST_PAGE ||
        isPhonePortrait()
      ) {


        showSinglePage(
          currentPage
        );


      } else {


        showSpread(
          currentPage
        );

      }

    }



    /* =========================
       次へ
    ========================= */


    function nextPage() {


      /*
        スマホ縦
        1ページずつ進む
      */


      if (
        isPhonePortrait()
      ) {


        if (
          currentPage <
          LAST_PAGE
        ) {


          currentPage++;


          render();

        }


        return;

      }



      /*
        PC

        1
        ↓
        3 | 2
        ↓
        5 | 4
        ↓
        7 | 6
      */


      if (
        currentPage ===
        FIRST_PAGE
      ) {


        currentPage = 2;


        render();


        return;

      }



      const rightNumber =
        currentPage % 2 === 0
          ? currentPage
          : currentPage - 1;



      /*
        6・7表示中なら
        それ以上進まない
      */


      if (
        rightNumber + 1 >=
        LAST_PAGE
      ) {


        return;

      }



      currentPage =
        rightNumber + 2;


      render();

    }



    /* =========================
       戻る
    ========================= */


    function prevPage() {


      /*
        スマホ縦
        1ページずつ戻る
      */


      if (
        isPhonePortrait()
      ) {


        if (
          currentPage >
          FIRST_PAGE
        ) {


          currentPage--;


          render();

        }


        return;

      }



      /*
        1Pなら
        それ以上戻らない
      */


      if (
        currentPage <=
        FIRST_PAGE
      ) {


        return;

      }



      const rightNumber =
        currentPage % 2 === 0
          ? currentPage
          : currentPage - 1;



      /*
        3 | 2
        ↓
        1
      */


      if (
        rightNumber <= 2
      ) {


        currentPage =
          FIRST_PAGE;


      } else {


        /*
          その他は
          見開きを1つ戻る
        */


        currentPage =
          rightNumber - 2;

      }


      render();

    }



    /* =========================
       画像先読み
    ========================= */


    function preload(
      pageNumber
    ) {


      if (
        pageNumber <
          FIRST_PAGE ||
        pageNumber >
          LAST_PAGE
      ) {


        return;

      }


      const image =
        new Image();


      image.src =
        filename(
          pageNumber
        );

    }



    /* =========================
       クリック
    ========================= */


    nextZone
      .addEventListener(
        "click",
        nextPage
      );


    prevZone
      .addEventListener(
        "click",
        prevPage
      );



    /* =========================
       キーボード
    ========================= */


    document
      .addEventListener(
        "keydown",
        event => {


          /*
            日本漫画方向

            ← 次へ
            → 戻る
          */


          if (
            event.key ===
            "ArrowLeft"
          ) {


            nextPage();

          }


          if (
            event.key ===
            "ArrowRight"
          ) {


            prevPage();

          }

        }
      );



    /* =========================
       スマホ回転
    ========================= */


    window
      .addEventListener(
        "resize",
        render
      );



    /* =========================
       最初に1P表示
    ========================= */


    render();


  </script>
