  <style>

    .not-found-box {
      width: min(700px, 92%);
      margin: 70px auto 0;
      padding: 70px 40px 75px;

      text-align: center;
    }

    .not-found-number {
      margin: 0;
      color: #eee;
      font-size: 72px;
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .not-found-title {
      margin: 25px 0 0;
      color: #ddd;
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .not-found-text {
      margin: 30px 0 0;
      color: #aaa;
      font-size: 12px;
      line-height: 2;
    }

    .home-button {
      display: block;
      width: fit-content;
      margin: 45px auto 0;
      padding: 11px 28px;

      border: 1px solid #888;

      color: #bbb;
      text-decoration: none;

      font-size: 12px;
      letter-spacing: 0.12em;
    }

    .home-button:hover {
      color: #fff;
      border-color: #fff;
    }

    @media (max-width: 700px) {

      .not-found-box {
        width: 100%;
        margin-top: 45px;
        padding: 55px 20px 60px;
      }

      .not-found-number {
        font-size: 58px;
      }

      .not-found-title {

    }
